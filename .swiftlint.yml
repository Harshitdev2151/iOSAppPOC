disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional

analyzer_rules:
  - unused_import

included:
  - LBGSystemiOSTest

excluded:
  - Pods
  - Carthage
  - DerivedData

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 40
  error: 80

identifier_name:
  min_length: 2
  max_length: 40

reporter: "xcode"
